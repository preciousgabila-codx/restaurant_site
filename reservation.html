<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAMA'S-KITCHEN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo"><img src="images/logo.svg" alt="Restaurant Logo"></div>
        <div class="nav-links">
            <nav><a href="index.html">HOME</a></nav>
            <nav><a href="about.html">ABOUTUS</a></nav>
            <nav><a href="menu.html">MENU</a></nav>
            <nav><a href="reservation.html">RESERVATION</a></nav>
        </div>
        <div>
            <button type="button">SIGNUP</button>
            <button type="button">PROFILE</button>
        </div>
    </header>
    <p>Rerve Your Table</p> 
    <form action="submit" class="reserve-form">
        <div class="form-input">
            <label for="full-name">Full Name:</label>
            <input type="text" id="full-name" name="full-name">
        </div>
        <div class="form-input">
            <label for="phone-number">Phone Number:</label>
            <input type="number" id="phone-number" name="phone-number">
        </div>
        <div class="form-input">
            <label for="Email">Email:</label>
            <input type="email" id="'Email" name="Email">
        </div>
        <div class="form-input">
            <label for="date">Date:</label>
            <input type="datetime" id="date" name="date">
        </div>
        <div class="form-input">
            <label for="time">Time:</label>
            <input type="datetime" id="'time" name="time">
        </div>
        <div class="form-input">
            <label for="number-of-guest">Number of guest:</label>
            <input type="number" id="'number-of-guest" name="number-of-guest">
        </div>
        <div class="form-input">
            <label for="request">Request:</label>
            <input type="text" id="request" name="request">
        </div>
        <input type="submit" value="SUBMIT">
    </form>
    <footer>
        <p class="copy">© Copyright Mama's kitchen all right reserved 2026</p>
    </footer>
</body>
</html>
